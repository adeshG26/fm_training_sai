# Intake mapping for the L&D client tables (FM_training/data).
#
# Started from `pragmatiq intake discover` (client.draft.yaml) and reviewed:
#   * source_name is always one of pragmatiq's SOURCES
#     (transaction / app / trading / communication) - anything else fails validate.
#   * profiles are NOT cut at a label's eval_ts (only events are), so profile
#     attributes/milestones that can change after the cutoff are dropped
#     (closure date, active flags, last KYC review) to keep labels leak-free.
#   * date/datetime columns used as *values* are coarsened to the day and would
#     each add ~1,000 distinct strings to the vocabulary; they are dropped where
#     the event time already carries the information.
#   * monetary / score columns are listed as numeric so the report treats them
#     as percentile-binned magnitudes.
client: ld_paypal
source: ../data
options:
  timezone: UTC
  drop_future_events: true
  # The tables run 2025-10-01 .. 2028-09-30. Without a pinned clock every row
  # after today's date is dropped as a "future event".
  now: "2028-10-01"

tables:
  # ---------------------------------------------------------------- profile
  customer_profile:
    shape: entity_master
    entity: customer_id
    lifelong:
      - relationship_open_date
      - acc_cre_ts
    fields:
      drop:
        - relationship_close_date      # future-dated closure would leak churn/default
        - customer_is_active           # current state, not as-of the eval point
        - is_cust_stat_clr_y_n         # current status flag
        - kyc_last_review_date         # may fall after the eval point
        - kyc_risk_rating              # re-rated after fraud/AML events

  # ---------------------------------------------------------------- transactions
  txn_event:
    shape: event_stream
    entity: customer_id
    # when the bank could actually see the record: no look-ahead when serving
    time: record_available_timestamp
    source_name: transaction
    fields:
      drop:
        - txn_event_id
        - link_reference
        - linked_event_id
        - product_id
        - merchant_id                  # used for the merchant enrichment, then dropped
        - reversed_transaction_id
        - account_number_masked
        - alert_id
        - event_timestamp              # timing already carried by the event time
        - posted_timestamp
        - settlement_timestamp
      numeric: [amount, fx_rate, balance_before]

  merchant:
    shape: dimension
    action: enrich
    enrich_into: txn_event
    enrich_on: merchant_id
    fields:
      include: [primary_mcc]           # merchant_country already exists on txn_event

  product_snapshot:
    shape: periodic_snapshot
    entity: customer_id
    time: snapshot_date
    source_name: transaction
    emit: changes_only
    snapshot_of: product_id
    fields:
      drop:
        - product_id
        - account_number_masked
        - linked_product_id
        - open_date
        - close_date
        - delinquency_start_date
        - last_statement_date
        - last_due_date
      numeric: [current_balance, credit_limit, interest_rate_pct, days_delinquent, overdue_amount,
                overdue_principal_amt, instalments_missed_count, principal_amount,
                sanctioned_amount, instalment_amount, tenor_days, minimum_due]

  # ---------------------------------------------------------------- app
  interaction_event:
    shape: event_stream
    entity: customer_id
    time: event_time
    source_name: app
    fields:
      drop: [event_id, session_id, event_sequence_number, transaction_id]
      numeric: [amt_txn]

  session:
    shape: event_stream
    entity: customer_id
    time: session_start
    source_name: app
    fields:
      drop: [session_id, session_end, device_id, ip_address_hash, geo_location_hash]

  product_event:
    shape: event_stream
    entity: customer_id
    time: event_date
    source_name: app
    fields:
      drop: [prd_event_id, product_id, application_id]
      numeric: [old_limit, new_limit, approved_amount]

  customer_snapshot:
    shape: periodic_snapshot
    entity: customer_id
    time: snapshot_date
    source_name: app
    emit: changes_only
    fields:
      drop: [credit_score_bureau_date, credit_score_internal_date]
      numeric: [credit_score_bureau, credit_score_internal, total_aum]

  # ---------------------------------------------------------------- communication
  fraud_case:
    shape: event_stream
    entity: customer_id
    time: alert_timestamp
    source_name: communication
    fields:
      drop: [alert_id, fraud_case_id, case_open_timestamp]

  fraud_case_snapshot:
    shape: child_of_event
    time: snapshot_date
    source_name: communication
    resolve_entity_via:
      parent: fraud_case
      key: alert_id
    fields:
      drop: [alert_id, disposition_timestamp]
      numeric: [total_exposure_amount, confirmed_loss_amount]

  collections_case:
    shape: event_stream
    entity: customer_id
    time: case_open_timestamp
    source_name: communication
    fields:
      drop: [collection_case_id, product_id, promise_made_timestamp, promise_date,
             arrangement_start_date]
      numeric: [case_open_dpd, outstanding_at_assignment, promise_amount, number_of_instalments,
                instalment_amount, total_arrangement_amount]

  collections_case_snapshot:
    shape: child_of_event
    time: snapshot_date
    source_name: communication
    resolve_entity_via:
      parent: collections_case
      key: collection_case_id
    fields:
      drop: [collection_case_id, action_id, action_timestamp]
      numeric: [amount_collected_to_date, dpd_at_action, action_amount_collected, writeoff_amount,
                recovery_amount]
